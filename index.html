<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alex Blanco" />
    <meta name="description" content="Flash Card Deck builder & viewer" />
    <meta
      name="keywords"
      content="flashcards, study guide, study aids, learning materials, test guide"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Flash Cards</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index.js" type="module"></script>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>

        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button
            class="gallery__new-card-btn"
            aria-label="Create new deck"
            type="button"
          >
            + New Deck
          </button>
        </div>
      </section>

      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            aria-label="Create new card"
            type="button"
          >
            + New Card
          </button>
        </div>
      </section>

      <section id="carousel" class="carousel">
        <h2 class="carousel__title">
          Some Deck &middot; Current card/Total cards
        </h2>
        <div class="carousel__grid">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <p class="carousel__card">&lt;body&gt;&lt;/body&gt;</p>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
          <button
            type="button"
            aria-label="Flip current card in deck"
            class="carousel__btn carousel__btn_type_flip"
          ></button>
        </div>
      </section>

      <section id="new-deck-view" class="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <label class="new-deck-view__json-label" for="json-text">
            Write the JSON array of cards so that it matches this schema
            <textarea
              class="new-deck-view__json-text"
              id="json-text"
              name="json-text"
              placeholder='{&#10;  "name": "Deck Name",&#10;  "cards": [&#10;    {&#10;      "question": "Question?",&#10;      "answer": "Answer"&#10;    },&#10;    ...&#10;  ]&#10;}'
            ></textarea>
          </label>
          <button type="submit" class="new-deck-view__submit-btn" disabled>
            Create the deck
          </button>
        </form>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404 Not Found</h2>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Alex Blanco</p>
    </footer>

    <template id="deck-template">
      <li class="card card_color_green">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <div class="card__count"></div>
          <button
            class="card__delete-btn"
            aria-label="Delete this deck"
            type="button"
          >
            <img src="./assets/images/delete.svg" alt="Delete icon" />
          </button>
        </div>
        <a class="card__link" href="#"></a>
      </li>
    </template>

    <template id="card-template">
      <li class="card card_color_green">
        <h3 class="card__title"></h3>
        <div class="card__row">
          <button class="card__flip-btn" aria-label="Flip card" type="button">
            <img src="./assets/images/flip.svg" alt="Flip icon" />
          </button>
          <button
            class="card__delete-btn"
            aria-label="Delete card"
            type="button"
          >
            <img src="./assets/images/delete.svg" alt="Delete icon" />
          </button>
        </div>
      </li>
    </template>
  </body>
</html>
