<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alex Blanco" />
    <meta name="description" content="Flash Card Deck builder & viewer" />
    <meta
      name="keywords"
      content="flashcards, study guide, study aids, learning materials, test guide"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Flash Cards</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/index.js" type="module"></script>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#home" class="nav__link">My Decks</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>

        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents"></ul>
          <button
            class="decks__new-deck-btn"
            aria-label="Create new deck"
            type="button"
          >
            + New Deck
          </button>
        </div>
      </section>

      <section id="carousel" class="carousel">
        <h2 class="carousel__title">
          Some Deck &middot; Current card/Total cards
        </h2>
        <div class="carousel__card">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip current card in deck"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404 Not Found</h2>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Alex Blanco</p>
    </footer>

    <template id="deck-template">
      <li class="deck deck_color_green">
        <h3 class="deck__title"></h3>
        <div class="deck__row">
          <div class="deck__count"></div>
          <button
            class="deck__delete-btn"
            aria-label="Delete this deck"
            type="button"
          >
            <img src="./assets/images/delete.svg" alt="Delete icon" />
          </button>
        </div>
        <a class="deck__link" href="#"></a>
      </li>
    </template>
  </body>
</html>
